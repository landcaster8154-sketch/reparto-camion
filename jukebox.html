<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ChromeBox Jukebox</title>
<style>
  :root{
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #23272f;
    --accent: #4dd0e1;
    --accent-2: #ff6b6b;
    --text: #e8e8e8;
    --text-dim: #8a8f98;
    --border: #2c313a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #app {
    display:flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 900px;
    margin: 0 auto;
  }
  #app.queue-mode header,
  #app.queue-mode #folder-bar {
    display: none;
  }
  header {
    padding: 14px 16px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .header-btns {
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin:0;
    letter-spacing: .5px;
  }
  header h1 span { color: var(--accent); }
  .btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    touch-action: manipulation;
  }
  .btn:active { background:#2d323c; }
  .btn.accent { background: var(--accent); color:#08222a; border-color: var(--accent); font-weight:600; }
  .btn.danger { color: var(--accent-2); }

  #folder-bar {
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #folder-select {
    flex:1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    min-width: 0;
  }
  #btn-delete-folder {
    padding: 8px 12px;
    font-size: 12px;
    flex-shrink: 0;
  }

  #view-tabs {
    display: flex;
    gap: 8px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .view-tab {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    touch-action: manipulation;
  }
  .view-tab.active { background: var(--accent); color: #08222a; border-color: var(--accent); }

  .view { flex: 1; display: none; flex-direction: column; min-height: 0; overflow: hidden; }
  .view.active { display: flex; }

  #queue-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px;
    min-height: 0;
  }
  .q-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 8px;
    border-radius: 10px;
    touch-action: manipulation;
  }
  .q-item:active { background: var(--panel-2); }
  .q-item.playing { background: rgba(77,208,225,0.10); }
  .q-cover {
    position: relative;
    width: 48px; height: 48px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--text-dim);
  }
  .q-cover img { width:100%; height:100%; object-fit: cover; }
  .q-play {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px;
  }
  .q-item:not(.playing) .q-play { display: none; }
  .q-item:active .q-play { display: flex; }
  .q-info { flex: 1; min-width: 0; text-align: left; }
  .q-name {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .q-name.playing { color: var(--accent); }
  .q-sub {
    font-size: 12px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #nowplaying {
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    text-align: left;
    background: linear-gradient(180deg, var(--panel), var(--bg));
  }
  #cover-wrap {
    position: relative;
    flex-shrink: 0;
    width: 96px;
    height: 96px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action: manipulation;
  }
  #cover-img {
    width:100%; height:100%;
    object-fit: cover;
    display:none;
  }
  #cover-placeholder {
    font-size: 36px;
    color: var(--text-dim);
  }
  #cover-expand {
    position:absolute;
    bottom:4px; right:4px;
    width:26px; height:26px;
    border-radius:50%;
    background: rgba(0,0,0,0.55);
    color:#fff;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    cursor:pointer;
  }
  #nowplaying-text { flex: 1; min-width: 0; }
  #np-title { font-size: 17px; font-weight:600; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #np-title.empty { color: var(--text-dim); font-weight:400; }
  #np-sub { font-size: 12px; color: var(--text-dim); margin:0; }
  #track-count { display:none; }

  #fullscreen-cover {
    position: fixed;
    inset: 0;
    background: #000;
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 999;
    flex-direction: column;
  }
  #fullscreen-cover.open { display:flex; }
  #fullscreen-cover img {
    max-width: 96vw;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 10px;
  }
  #fullscreen-cover .fs-placeholder {
    font-size: 160px;
    color: #444;
  }
  #fullscreen-cover .fs-title {
    color: #fff;
    font-size: 16px;
    margin-top: 18px;
    text-align:center;
    padding: 0 20px;
  }
  #fullscreen-cover .fs-sub {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
  }
  #fs-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 42px; height:42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color:#fff;
    border:none;
    font-size: 20px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #progress-wrap {
    padding: 6px 16px 0;
  }
  #progress {
    width:100%;
    height: 6px;
    -webkit-appearance:none;
    appearance:none;
    background: var(--panel-2);
    border-radius: 4px;
    outline:none;
  }
  #progress::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--accent);
    cursor:pointer;
  }
  #times {
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--text-dim);
    padding: 2px 2px 0;
  }

  #volume-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 16px 2px;
  }
  #volume-wrap .vol-icon { font-size: 15px; color: var(--text-dim); flex-shrink:0; }
  #volume {
    flex: 1;
    height: 5px;
    -webkit-appearance:none;
    appearance:none;
    background: var(--panel-2);
    border-radius: 4px;
    outline:none;
  }
  #volume::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background: var(--accent);
    cursor:pointer;
  }

  #controls {
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    padding: 14px 16px 18px;
  }
  .ctrl-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 52px; height:52px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 20px;
    cursor:pointer;
    touch-action: manipulation;
  }
  .ctrl-btn:active { background:#2d323c; }
  .ctrl-btn.play {
    width: 66px; height:66px;
    background: var(--accent);
    color:#08222a;
    font-size: 26px;
  }
  .ctrl-btn.toggled { color: var(--accent); border-color: var(--accent); }

  #file-input, #folder-input { display:none; }
  #status-msg {
    text-align:center;
    font-size: 12px;
    color: var(--text-dim);
    padding: 4px 16px;
    min-height: 16px;
  }

  @media (max-height: 480px) {
    header { padding: 6px 16px 5px; }
    header h1 { font-size: 14px; }
    .header-btns .btn { padding: 6px 10px; font-size: 12px; }
    #folder-bar { padding: 5px 16px; }
    #view-tabs { padding: 5px 16px; }
    .view-tab { padding: 6px; font-size: 12px; }
    #nowplaying { padding: 8px 16px; gap: 10px; }
    #cover-wrap { width: 64px; height: 64px; border-radius: 10px; }
    #cover-placeholder { font-size: 24px; }
    #cover-expand { width: 20px; height: 20px; font-size: 10px; }
    #np-title { font-size: 14px; }
    #np-sub { font-size: 10px; }
    #progress-wrap { padding: 2px 16px 0; }
    #times { font-size: 10px; }
    #volume-wrap { padding: 1px 16px 1px; gap: 6px; }
    #volume-wrap .vol-icon { font-size: 12px; }
    #controls { padding: 5px 16px 6px; gap: 10px; }
    .ctrl-btn { width: 36px; height: 36px; font-size: 15px; }
    .ctrl-btn.play { width: 44px; height: 44px; font-size: 18px; }
    #status-msg { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Chrome<span>Box</span> Jukebox</h1>
    <div class="header-btns">
      <button class="btn accent" id="btn-add" title="Añadir canciones sueltas">＋ Música</button>
      <button class="btn accent" id="btn-add-folder" title="Añadir una carpeta completa">📁 Carpeta</button>
      <button class="btn danger" id="btn-clear" title="Vaciar toda la música guardada">🗑</button>
    </div>
  </header>

  <input type="file" id="file-input" accept="audio/*" multiple>
  <input type="file" id="folder-input" webkitdirectory multiple>

  <div id="folder-bar">
    <select id="folder-select">
      <option value="">📁 Todas las canciones</option>
    </select>
    <button class="btn danger" id="btn-delete-folder" title="Borrar esta carpeta" style="display:none;">🗑 Borrar carpeta</button>
  </div>

  <div id="view-tabs">
    <button class="view-tab active" id="tab-player" data-view="player">🎧 Reproductor</button>
    <button class="view-tab" id="tab-queue" data-view="queue">📃 Cola</button>
  </div>

  <div id="view-player" class="view active">
    <div id="nowplaying">
      <div id="cover-wrap">
        <img id="cover-img" alt="Portada">
        <div id="cover-placeholder">🎵</div>
        <button id="cover-expand" title="Ver a pantalla completa">⛶</button>
      </div>
      <div id="nowplaying-text">
        <p id="np-title" class="empty">Nada en reproducción</p>
        <p id="np-sub"></p>
        <p id="track-count">0 canciones cargadas</p>
      </div>
    </div>

    <div id="progress-wrap">
      <input type="range" id="progress" min="0" max="100" value="0">
      <div id="times">
        <span id="time-cur">0:00</span>
        <span id="time-dur">0:00</span>
      </div>
    </div>

    <div id="volume-wrap">
      <span class="vol-icon">🔈</span>
      <input type="range" id="volume" min="0" max="100" value="100">
      <span class="vol-icon">🔊</span>
    </div>

    <div id="controls">
      <button class="ctrl-btn" id="btn-shuffle" title="Aleatorio">🔀</button>
      <button class="ctrl-btn" id="btn-prev" title="Anterior">⏮</button>
      <button class="ctrl-btn play" id="btn-play" title="Play/Pausa">▶</button>
      <button class="ctrl-btn" id="btn-next" title="Siguiente">⏭</button>
      <button class="ctrl-btn" id="btn-repeat" title="Repetir">🔁</button>
    </div>
  </div>

  <div id="view-queue" class="view">
    <div id="queue-list"></div>
  </div>

  <div id="fullscreen-cover">
    <button id="fs-close">✕</button>
    <img id="fs-cover-img" alt="Portada" style="display:none;">
    <div id="fs-cover-placeholder" class="fs-placeholder">🎵</div>
    <div id="fs-title" class="fs-title"></div>
    <div id="fs-sub" class="fs-sub"></div>
  </div>

  <div id="status-msg"></div>

</div>

<audio id="audio-el"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- IndexedDB ----------
  const DB_NAME = "chromebox_jukebox";
  const STORE = "tracks";
  let db = null;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const _db = e.target.result;
        if(!_db.objectStoreNames.contains(STORE)){
          _db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e);
    });
  }

  function dbAddTrack(name, blob, folder){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      const store = tx.objectStore(STORE);
      const req = store.add({ name, blob, folder: folder || "Sueltos", addedAt: Date.now() });
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e);
    });
  }

  function dbDeleteFolder(folderName){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      const store = tx.objectStore(STORE);
      const req = store.openCursor();
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if(cursor){
          if((cursor.value.folder || "Sueltos") === folderName) cursor.delete();
          cursor.continue();
        } else {
          resolve();
        }
      };
      req.onerror = (e) => reject(e);
    });
  }

  function dbGetAll(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const store = tx.objectStore(STORE);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e);
    });
  }

  function dbDelete(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      const store = tx.objectStore(STORE);
      const req = store.delete(id);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e);
    });
  }

  function dbUpdateCover(id, coverBlob){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      const store = tx.objectStore(STORE);
      const getReq = store.get(id);
      getReq.onsuccess = () => {
        const record = getReq.result;
        if(!record){ resolve(); return; }
        record.cover = coverBlob;
        const putReq = store.put(record);
        putReq.onsuccess = () => resolve();
        putReq.onerror = (e) => reject(e);
      };
      getReq.onerror = (e) => reject(e);
    });
  }

  function dbClear(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      const store = tx.objectStore(STORE);
      const req = store.clear();
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e);
    });
  }

  // ---------- State ----------
  let tracks = [];       // { id, name, blob, url }
  let currentIndex = -1;
  let isPlaying = false;
  let isShuffle = false;
  let repeatMode = 0;    // 0 = off, 1 = repeat all, 2 = repeat one
  let playOrder = [];    // shuffled indices

  // ---------- Elements ----------
  const audioEl = document.getElementById("audio-el");
  const fileInput = document.getElementById("file-input");
  const folderInput = document.getElementById("folder-input");
  const btnAdd = document.getElementById("btn-add");
  const btnAddFolder = document.getElementById("btn-add-folder");
  const btnPlay = document.getElementById("btn-play");
  const btnPrev = document.getElementById("btn-prev");
  const btnNext = document.getElementById("btn-next");
  const btnShuffle = document.getElementById("btn-shuffle");
  const btnRepeat = document.getElementById("btn-repeat");
  const btnClear = document.getElementById("btn-clear");
  const progressEl = document.getElementById("progress");
  const timeCurEl = document.getElementById("time-cur");
  const timeDurEl = document.getElementById("time-dur");
  const npTitle = document.getElementById("np-title");
  const npSub = document.getElementById("np-sub");
  const trackCountEl = document.getElementById("track-count");
  const statusEl = document.getElementById("status-msg");
  const coverImg = document.getElementById("cover-img");
  const coverPlaceholder = document.getElementById("cover-placeholder");
  const coverExpandBtn = document.getElementById("cover-expand");
  const fsOverlay = document.getElementById("fullscreen-cover");
  const fsCoverImg = document.getElementById("fs-cover-img");
  const fsCoverPlaceholder = document.getElementById("fs-cover-placeholder");
  const fsTitle = document.getElementById("fs-title");
  const fsSub = document.getElementById("fs-sub");
  const fsClose = document.getElementById("fs-close");
  const folderSelect = document.getElementById("folder-select");
  const btnDeleteFolder = document.getElementById("btn-delete-folder");
  const queueListEl = document.getElementById("queue-list");
  const volumeEl = document.getElementById("volume");
  const tabPlayer = document.getElementById("tab-player");
  const tabQueue = document.getElementById("tab-queue");
  const viewPlayer = document.getElementById("view-player");
  const viewQueue = document.getElementById("view-queue");

  function showView(name){
    tabPlayer.classList.toggle("active", name === "player");
    tabQueue.classList.toggle("active", name === "queue");
    viewPlayer.classList.toggle("active", name === "player");
    viewQueue.classList.toggle("active", name === "queue");
    document.getElementById("app").classList.toggle("queue-mode", name === "queue");
  }
  tabPlayer.addEventListener("click", () => showView("player"));
  tabPlayer.setAttribute("ontouchstart", "");
  tabQueue.addEventListener("click", () => showView("queue"));
  tabQueue.setAttribute("ontouchstart", "");

  let activeFolder = ""; // "" = todas las carpetas
  const ACTIVE_FOLDER_KEY = "cbx_active_folder";

  let extractQueue = [];
  let extracting = false;

  // ---------- Persistencia de posición (recordar canción y punto exacto) ----------
  const LAST_INDEX_KEY = "cbx_last_index"; // no usado ya (nos guiamos por id, más fiable)
  const LAST_TRACK_ID_KEY = "cbx_last_track_id";
  const LAST_TIME_SEC_KEY = "cbx_last_time";
  let lastSaveTs = 0;

  function saveProgress(force){
    const now = Date.now();
    if(!force && now - lastSaveTs < 3000) return; // no escribir más de una vez cada 3s
    lastSaveTs = now;
    try {
      if(currentIndex >= 0 && tracks[currentIndex]){
        localStorage.setItem(LAST_TRACK_ID_KEY, String(tracks[currentIndex].id));
        localStorage.setItem(LAST_TIME_SEC_KEY, String(audioEl.currentTime || 0));
      }
    } catch(e) {}
  }

  function setStatus(msg, ms){
    statusEl.textContent = msg;
    if(ms){
      setTimeout(() => { if(statusEl.textContent === msg) statusEl.textContent = ""; }, ms);
    }
  }

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return m + ":" + s;
  }

  // ---------- Rendering ----------
  function updateTrackCount(){
    trackCountEl.textContent = tracks.length + (tracks.length === 1 ? " canción cargada" : " canciones cargadas");
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function updateNowPlaying(){
    if(currentIndex === -1 || !tracks[currentIndex]){
      npTitle.textContent = "Nada en reproducción";
      npTitle.classList.add("empty");
      npSub.textContent = "";
      setCoverDisplay(null);
      renderQueue();
      return;
    }
    npTitle.classList.remove("empty");
    npTitle.textContent = tracks[currentIndex].name;
    npSub.textContent = (currentIndex + 1) + " de " + tracks.length;
    setCoverDisplay(tracks[currentIndex].coverUrl || null);
    renderQueue();
  }

  function renderQueue(){
    if(!tracks.length){
      queueListEl.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:30px 10px;font-size:13px;">Sin canciones cargadas</div>';
      return;
    }
    var order = (typeof playOrder !== "undefined" && playOrder && playOrder.length) ? playOrder : tracks.map((_, i) => i);
    var html = "";
    order.forEach(function(i){
      var t = tracks[i];
      if(!t) return;
      var playing = i === currentIndex;
      html += '<div class="q-item' + (playing ? ' playing' : '') + '" data-idx="' + i + '">' +
        '<div class="q-cover">' +
          (t.coverUrl ? '<img src="' + t.coverUrl + '" alt="">' : '🎵') +
          '<div class="q-play">' + (playing && isPlaying ? '⏸' : '▶') + '</div>' +
        '</div>' +
        '<div class="q-info">' +
          '<div class="q-name' + (playing ? ' playing' : '') + '">' + escapeHtml(t.name) + '</div>' +
          '<div class="q-sub">' + escapeHtml(t.folder || "Sueltos") + '</div>' +
        '</div>' +
      '</div>';
    });
    queueListEl.innerHTML = html;
    queueListEl.querySelectorAll(".q-item").forEach(function(el){
      el.addEventListener("click", function(){ playTrack(parseInt(this.dataset.idx, 10)); showView("player"); });
      el.setAttribute("ontouchstart", "");
    });
  }

  function setCoverDisplay(url){
    if(url){
      coverImg.src = url;
      coverImg.style.display = "block";
      coverPlaceholder.style.display = "none";
    } else {
      coverImg.style.display = "none";
      coverImg.src = "";
      coverPlaceholder.style.display = "flex";
    }
    // keep fullscreen overlay in sync if it's open
    if(fsOverlay.classList.contains("open")){
      openFullscreenCover();
    }
  }

  function openFullscreenCover(){
    const t = tracks[currentIndex];
    if(t && t.coverUrl){
      fsCoverImg.src = t.coverUrl;
      fsCoverImg.style.display = "block";
      fsCoverPlaceholder.style.display = "none";
    } else {
      fsCoverImg.style.display = "none";
      fsCoverPlaceholder.style.display = "block";
    }
    fsTitle.textContent = t ? t.name : "Nada en reproducción";
    fsSub.textContent = t ? (currentIndex + 1) + " de " + tracks.length : "";
    fsOverlay.classList.add("open");
  }

  coverExpandBtn.addEventListener("click", openFullscreenCover);
  coverExpandBtn.setAttribute("ontouchstart", "");
  fsClose.addEventListener("click", () => fsOverlay.classList.remove("open"));
  fsClose.setAttribute("ontouchstart", "");
  fsOverlay.addEventListener("click", (e) => {
    if(e.target === fsOverlay) fsOverlay.classList.remove("open");
  });

  // ---------- Cover extraction (ID3 embedded art) ----------
  function queueCoverExtraction(track, blob){
    extractQueue.push({ track, blob });
    processExtractQueue();
  }

  function processExtractQueue(){
    if(extracting || extractQueue.length === 0) return;
    extracting = true;
    const { track, blob } = extractQueue.shift();

    if(typeof jsmediatags === "undefined"){
      extracting = false;
      return;
    }

    jsmediatags.read(blob, {
      onSuccess: function(tag){
        try {
          const pic = tag.tags && tag.tags.picture;
          if(pic && pic.data && pic.data.length){
            const byteArray = new Uint8Array(pic.data);
            const coverBlob = new Blob([byteArray], { type: pic.format || "image/jpeg" });
            const url = URL.createObjectURL(coverBlob);
            track.coverUrl = url;
            dbUpdateCover(track.id, coverBlob).catch(() => {});
            if(tracks[currentIndex] && tracks[currentIndex].id === track.id){
              setCoverDisplay(url);
            }
            renderQueue();
          }
        } catch(err){
          console.warn("No se pudo procesar la portada de", track.name, err);
        }
        extracting = false;
        processExtractQueue();
      },
      onError: function(){
        extracting = false;
        processExtractQueue();
      }
    });
  }

  function updatePlayButton(){
    btnPlay.textContent = isPlaying ? "⏸" : "▶";
    var activeQ = queueListEl.querySelector('.q-item[data-idx="' + currentIndex + '"] .q-play');
    if(activeQ) activeQ.textContent = isPlaying ? "⏸" : "▶";
  }

  // ---------- Playback ----------
  function buildPlayOrder(){
    var indices = tracks.map((_, i) => i);
    if(activeFolder){
      indices = indices.filter(i => (tracks[i].folder || "Sueltos") === activeFolder);
    }
    playOrder = indices;
    if(isShuffle){
      for(let i = playOrder.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [playOrder[i], playOrder[j]] = [playOrder[j], playOrder[i]];
      }
    }
  }

  function renderFolderSelect(){
    const counts = {};
    tracks.forEach(t => {
      const f = t.folder || "Sueltos";
      counts[f] = (counts[f] || 0) + 1;
    });
    const folders = Object.keys(counts).sort((a,b) => a.localeCompare(b, "es"));

    let html = '<option value="">📁 Todas las canciones (' + tracks.length + ')</option>';
    folders.forEach(f => {
      const label = (f === "Sueltos" ? "🎵 Sueltos" : "📁 " + f) + " (" + counts[f] + ")";
      html += '<option value="' + escapeHtml(f) + '"' + (f === activeFolder ? " selected" : "") + '>' + escapeHtml(label) + '</option>';
    });
    folderSelect.innerHTML = html;

    // si la carpeta activa ya no existe (se borró), volver a "todas"
    if(activeFolder && !folders.includes(activeFolder)){
      activeFolder = "";
      folderSelect.value = "";
    }
    btnDeleteFolder.style.display = activeFolder ? "flex" : "none";
  }

  function playTrack(index){
    if(index < 0 || index >= tracks.length) return;
    currentIndex = index;
    const t = tracks[index];
    audioEl.src = t.url;
    audioEl.play().then(() => {
      isPlaying = true;
      updatePlayButton();
      updateNowPlaying();
      saveProgress(true);
    }).catch(err => {
      setStatus("No se pudo reproducir: " + t.name, 3000);
      console.error(err);
    });
  }

  function togglePlay(){
    if(currentIndex === -1){
      if(tracks.length > 0) playTrack(0);
      return;
    }
    if(isPlaying){
      audioEl.pause();
      isPlaying = false;
      saveProgress(true);
    } else {
      audioEl.play();
      isPlaying = true;
    }
    updatePlayButton();
  }

  function nextTrack(auto){
    if(tracks.length === 0) return;
    if(repeatMode === 2 && auto){
      playTrack(currentIndex);
      return;
    }
    let pos = playOrder.indexOf(currentIndex);
    pos = (pos + 1) % playOrder.length;
    if(pos === 0 && auto && repeatMode === 0){
      isPlaying = false;
      updatePlayButton();
      return;
    }
    playTrack(playOrder[pos]);
  }

  function prevTrack(){
    if(tracks.length === 0) return;
    if(audioEl.currentTime > 3){
      audioEl.currentTime = 0;
      return;
    }
    let pos = playOrder.indexOf(currentIndex);
    pos = (pos - 1 + playOrder.length) % playOrder.length;
    playTrack(playOrder[pos]);
  }

  // ---------- Events ----------
  btnAdd.addEventListener("click", () => fileInput.click());
  btnAdd.setAttribute("ontouchstart", "");
  btnAddFolder.addEventListener("click", () => folderInput.click());
  btnAddFolder.setAttribute("ontouchstart", "");

  const AUDIO_EXT_RE = /\.(mp3|wav|ogg|oga|flac|m4a|aac|opus)$/i;

  fileInput.addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    setStatus("Guardando " + files.length + " archivo(s)...");
    for(const f of files){
      try {
        await dbAddTrack(f.name, f, "Sueltos");
      } catch(err){
        console.error("Error guardando", f.name, err);
      }
    }
    setStatus("¡Listo! Música guardada localmente.", 2500);
    await loadTracksFromDB(true);
    fileInput.value = "";
  });

  folderInput.addEventListener("change", async (e) => {
    const all = Array.from(e.target.files || []);
    const files = all.filter(f => AUDIO_EXT_RE.test(f.name));
    if(files.length === 0){
      setStatus("Esa carpeta no tiene archivos de audio compatibles.", 3500);
      folderInput.value = "";
      return;
    }
    // nombre de la carpeta = primer tramo de la ruta relativa (la carpeta que eligió el usuario)
    const folderName = (files[0].webkitRelativePath || "").split("/")[0] || "Carpeta";
    setStatus("Guardando " + files.length + " archivo(s) de \"" + folderName + "\"...");
    for(const f of files){
      try {
        await dbAddTrack(f.name, f, folderName);
      } catch(err){
        console.error("Error guardando", f.name, err);
      }
    }
    setStatus("¡Carpeta \"" + folderName + "\" añadida! " + files.length + " canciones.", 3000);
    activeFolder = folderName; // saltar directamente a ver la carpeta recién añadida
    try { localStorage.setItem(ACTIVE_FOLDER_KEY, activeFolder); } catch(e) {}
    await loadTracksFromDB(true);
    folderInput.value = "";
    if(playOrder.length > 0){
      playTrack(playOrder[0]); // empezar a reproducir la carpeta recién añadida
    }
  });

  folderSelect.addEventListener("change", () => {
    activeFolder = folderSelect.value;
    try { localStorage.setItem(ACTIVE_FOLDER_KEY, activeFolder); } catch(e) {}
    buildPlayOrder();
    renderQueue();
    btnDeleteFolder.style.display = activeFolder ? "flex" : "none";
    if(activeFolder){
      const yaEnEstaCarpeta = tracks[currentIndex] && (tracks[currentIndex].folder || "Sueltos") === activeFolder;
      if(!yaEnEstaCarpeta && playOrder.length > 0){
        playTrack(playOrder[0]); // cambiar de carpeta = empezar a reproducirla
      } else {
        setStatus("Mostrando: " + activeFolder, 1800);
      }
    } else {
      setStatus("Mostrando todas las canciones", 1800);
    }
  });

  btnDeleteFolder.addEventListener("click", async () => {
    if(!activeFolder) return;
    if(!confirm("¿Borrar toda la carpeta \"" + activeFolder + "\"? Esta acción no se puede deshacer.")) return;
    const wasPlayingFromFolder = tracks[currentIndex] && (tracks[currentIndex].folder || "Sueltos") === activeFolder;
    await dbDeleteFolder(activeFolder);
    if(wasPlayingFromFolder){
      audioEl.pause();
      audioEl.src = "";
      isPlaying = false;
      currentIndex = -1;
      try {
        localStorage.removeItem(LAST_TRACK_ID_KEY);
        localStorage.removeItem(LAST_TIME_SEC_KEY);
      } catch(e) {}
    }
    setStatus("Carpeta borrada.", 2000);
    activeFolder = "";
    try { localStorage.setItem(ACTIVE_FOLDER_KEY, ""); } catch(e) {}
    await loadTracksFromDB(true);
  });

  btnPlay.addEventListener("click", togglePlay);
  btnNext.addEventListener("click", () => nextTrack(false));
  btnPrev.addEventListener("click", prevTrack);

  btnShuffle.addEventListener("click", () => {
    isShuffle = !isShuffle;
    btnShuffle.classList.toggle("toggled", isShuffle);
    buildPlayOrder();
    renderQueue();
    setStatus(isShuffle ? "Aleatorio activado" : "Aleatorio desactivado", 1500);
  });

  btnRepeat.addEventListener("click", () => {
    repeatMode = (repeatMode + 1) % 3;
    btnRepeat.classList.toggle("toggled", repeatMode !== 0);
    btnRepeat.textContent = repeatMode === 2 ? "🔂" : "🔁";
    const labels = ["Repetir: desactivado", "Repetir: toda la lista", "Repetir: canción actual"];
    setStatus(labels[repeatMode], 1500);
  });

  btnClear.addEventListener("click", async () => {
    if(tracks.length === 0) return;
    if(!confirm("¿Vaciar toda la música guardada (todas las carpetas)? Esta acción no se puede deshacer.")) return;
    audioEl.pause();
    audioEl.src = "";
    isPlaying = false;
    currentIndex = -1;
    activeFolder = "";
    await dbClear();
    try {
      localStorage.removeItem(LAST_TRACK_ID_KEY);
      localStorage.removeItem(LAST_TIME_SEC_KEY);
      localStorage.removeItem(ACTIVE_FOLDER_KEY);
    } catch(e) {}
    await loadTracksFromDB(true);
    setStatus("Playlist vaciada.", 2000);
  });

  progressEl.addEventListener("input", () => {
    if(audioEl.duration){
      audioEl.currentTime = (progressEl.value / 100) * audioEl.duration;
      saveProgress(true);
    }
  });

  audioEl.addEventListener("timeupdate", () => {
    if(audioEl.duration){
      progressEl.value = (audioEl.currentTime / audioEl.duration) * 100;
      timeCurEl.textContent = fmtTime(audioEl.currentTime);
      timeDurEl.textContent = fmtTime(audioEl.duration);
    }
    saveProgress(false); // guarda como mucho cada 3s
  });

  audioEl.addEventListener("ended", () => {
    nextTrack(true);
  });

  audioEl.addEventListener("pause", () => {
    saveProgress(true);
  });

  window.addEventListener("beforeunload", () => saveProgress(true));
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "hidden") saveProgress(true);
  });

  // ---------- Loading ----------
  // preservePlayback=true evita cortar el audio si ya había una canción sonando
  // (por ejemplo, al añadir más música mientras suena algo)
  async function loadTracksFromDB(preservePlayback){
    const records = await dbGetAll();
    const currentTrackId = (preservePlayback && tracks[currentIndex]) ? tracks[currentIndex].id : null;

    const oldById = {};
    tracks.forEach(t => { oldById[t.id] = t; });

    // revocar URLs antiguas, salvo la que está sonando ahora mismo
    tracks.forEach(t => {
      if(t.id === currentTrackId) return;
      if(t.url) URL.revokeObjectURL(t.url);
      if(t.coverUrl) URL.revokeObjectURL(t.coverUrl);
    });

    tracks = records.map(r => {
      const reuse = (r.id === currentTrackId) ? oldById[r.id] : null;
      return {
        id: r.id,
        name: r.name,
        folder: r.folder || "Sueltos",
        url: reuse ? reuse.url : URL.createObjectURL(r.blob),
        coverUrl: r.cover ? (reuse && reuse.coverUrl ? reuse.coverUrl : URL.createObjectURL(r.cover)) : null,
        _rawBlob: r.blob
      };
    });

    renderFolderSelect();
    buildPlayOrder();

    if(currentTrackId !== null){
      const newIdx = tracks.findIndex(t => t.id === currentTrackId);
      if(newIdx !== -1){
        currentIndex = newIdx;
      } else {
        // la canción que sonaba se ha borrado
        audioEl.pause();
        audioEl.src = "";
        isPlaying = false;
        currentIndex = -1;
        updatePlayButton();
      }
    }

    updateNowPlaying();
    updateTrackCount();

    // extraer portada para los que aún no la tengan guardada
    tracks.forEach(t => {
      if(!t.coverUrl){
        queueCoverExtraction(t, t._rawBlob);
      }
    });
  }

  // Al abrir la app: dejar preparada la última canción que sonaba, en el punto
  // exacto donde se quedó, sin reproducirla automáticamente.
  function restoreLastPosition(){
    let savedId, savedTime;
    try {
      savedId = localStorage.getItem(LAST_TRACK_ID_KEY);
      savedTime = parseFloat(localStorage.getItem(LAST_TIME_SEC_KEY));
    } catch(e) { return; }
    if(!savedId) return;
    const idx = tracks.findIndex(t => String(t.id) === String(savedId));
    if(idx === -1) return;

    currentIndex = idx;
    const track = tracks[idx];
    audioEl.src = track.url;
    if(!isNaN(savedTime) && savedTime > 0){
      const onMeta = () => {
        audioEl.currentTime = savedTime;
        audioEl.removeEventListener("loadedmetadata", onMeta);
      };
      audioEl.addEventListener("loadedmetadata", onMeta);
    }
    updateNowPlaying();
    setStatus("Recuperada: " + track.name, 3000);
  }

  async function init(){
    try {
      db = await openDB();
      try { activeFolder = localStorage.getItem(ACTIVE_FOLDER_KEY) || ""; } catch(e) {}
      var savedVol = null;
      try { savedVol = localStorage.getItem("cbx_volume"); } catch(e) {}
      var vol = savedVol !== null ? parseInt(savedVol, 10) : 100;
      if(isNaN(vol)) vol = 100;
      volumeEl.value = vol;
      audioEl.volume = vol / 100;
      await loadTracksFromDB(false);
      restoreLastPosition();
    } catch(err){
      setStatus("Error al abrir almacenamiento local.", 4000);
      console.error(err);
    }
  }

  volumeEl.addEventListener("input", () => {
    audioEl.volume = volumeEl.value / 100;
    try { localStorage.setItem("cbx_volume", volumeEl.value); } catch(e) {}
  });

  // Ensure buttons respond on WebView/touch devices too
  document.querySelectorAll("button").forEach(b => b.setAttribute("ontouchstart", ""));

  init();
})();
</script>
